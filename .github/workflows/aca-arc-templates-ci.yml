name: Validate ACA Arc templates

on:
  pull_request:
    paths:
      - "aca-arc-templates/**"
      - ".github/workflows/aca-arc-templates-ci.yml"
  push:
    branches:
      - main
    paths:
      - "aca-arc-templates/**"
      - ".github/workflows/aca-arc-templates-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aca-arc-templates
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aca-arc-templates/pyproject.toml

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[test]"

      - name: Run tests
        run: python -m pytest

      - name: Compile Python
        run: python -m compileall -q app tests

      - name: Validate Bash scripts
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) > $null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Run safe static checks
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path(".")
          text_suffixes = {".css", ".env", ".example", ".html", ".js", ".md", ".ps1", ".py", ".sh", ".toml", ".yaml"}
          text = "\n".join(
              path.read_text(encoding="utf-8")
              for path in root.rglob("*")
              if path.is_file()
              and (path.suffix in text_suffixes or path.name == "Dockerfile")
              and not {"__pycache__", ".pytest_cache", ".venv"}.intersection(path.parts)
          )
          assert not re.search(
              r"\b[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-"
              r"[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\b",
              text,
          ), "A GUID-like value was checked in"
          dockerfile = (root / "Dockerfile").read_text(encoding="utf-8")
          assert ":latest" not in dockerfile.lower()
          assert "USER 65532:65532" in dockerfile
          manifest = (root / "deploy/containerapp.yaml").read_text(encoding="utf-8")
          for marker in ("${LOCATION}", "${CONNECTED_ENVIRONMENT_RESOURCE_ID}", "${IMAGE_REFERENCE}"):
              assert marker in manifest
